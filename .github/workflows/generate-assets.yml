name: Generate Instagram assets
on:
  push:
    paths:
      - 'prepare_post.py'
      - 'generate_reel.py'
      - '.github/workflows/generate-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python prepare_post.py
      - run: python generate_reel.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/ reels/
          git diff --cached --quiet || git commit -m "Generate approved FitOfertas Instagram assets"
          git push
