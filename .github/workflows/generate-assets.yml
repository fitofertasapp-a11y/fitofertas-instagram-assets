name: Generate Instagram assets
on:
  push:
    paths:
      - 'publish_carousel_2026_10_07.py'
      - 'publish_story_2026_10_07.py'
      - 'publish_benefits_post_2026_10_07.py'
      - '.github/workflows/generate-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python publish_carousel_2026_10_07.py
      - run: python publish_story_2026_10_07.py
      - run: python publish_benefits_post_2026_10_07.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carousels/ stories/ posts/
          git diff --cached --quiet || git commit -m "Generate approved FitOfertas Instagram assets"
          git push
